name: SuperQA PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  superqa-protect:
    name: SuperQA Protect
    runs-on: ubuntu-latest
    timeout-minutes: 35
    
    steps:
    - name: Analyze changes and run affected tests
      id: protect
      uses: usecasemonitor/superqa-githubaction@main
      with:
        api_key: ${{ secrets.SUPERQA_API_KEY }}
        project_id: '6af55d53cc5843be4009512d'
        project_name: 'Super Nova'
        mode: protect
        environment_name: 'staging'
        parallel_run: 'true'
        notification_emails: 'pavankumar230799@gmail.com'
        notify_on_success: 'true'
        skip_notifications: 'false'
        wait_for_result: 'true'
        timeout_seconds: '1800'
        poll_interval_seconds: '5'

    - name: Show SuperQA result
      if: always()
      env:
        RESULT: ${{ steps.protect.outputs.test_result }}
        DECISION: ${{ steps.protect.outputs.release_decision }}
        CONFIDENCE: ${{ steps.protect.outputs.confidence_score }}
        REPORT_URL: ${{ steps.protect.outputs.report_url }}
        ERROR_MESSAGE: ${{ steps.protect.outputs.error_message }}
      run: |
        echo "Result: $RESULT"
        echo "Release decision: $DECISION"
        echo "Confidence: $CONFIDENCE"
        echo "Report: $REPORT_URL"
        if [ -n "$ERROR_MESSAGE" ]; then
          echo "Error: $ERROR_MESSAGE"
        fi

  superqa-security:
    name: SuperQA Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
    - name: Scan pull-request security
      id: security
      uses: usecasemonitor/superqa-githubaction@main
      with:
        api_key: ${{ secrets.SUPERQA_API_KEY }}
        project_id: '6af55d53cc5843be4009512d'
        project_name: 'Super Nova'
        mode: security-scan
        wait_for_result: 'true'
        timeout_seconds: '1800'
        poll_interval_seconds: '5'

    - name: Show security scan result
      if: always()
      env:
        SECURITY_STATUS: ${{ steps.security.outputs.security_status }}
        SECURITY_FINDINGS: ${{ steps.security.outputs.security_findings }}
        SECURITY_REPORT_URL: ${{ steps.security.outputs.security_report_url }}
        ERROR_MESSAGE: ${{ steps.security.outputs.error_message }}
      run: |
        echo "Security status: $SECURITY_STATUS"
        echo "Security findings: $SECURITY_FINDINGS"
        echo "Security report: $SECURITY_REPORT_URL"
        if [ -n "$ERROR_MESSAGE" ]; then
          echo "Error: $ERROR_MESSAGE"
        fi
