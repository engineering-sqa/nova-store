name: SuperQA Protect

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  superqa-protect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    
    steps:
    - name: Analyze changes and run affected tests
      id: superqa
      uses: usecasemonitor/superqa-githubaction@dev1
      with:
        api_key: ${{ secrets.SUPERQA_API_KEY }}
        project_name: "Nova SuperQA"
        test_plan_name: "nova superqa login - Smoke Test Plan"
        environment_name: "staging"
        wait_for_result: true
        timeout_seconds: 1800
        poll_interval_seconds: 5
        parallel_run: true
        
    - name: Show SuperQA result
      if: always()
      env:
        RESULT: ${{ steps.superqa.outputs.test_result }}
        REPORT_URL: ${{ steps.superqa.outputs.report_url }}
      run: |
        echo "Result: $RESULT"
        echo "Report: $REPORT_URL"
